<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Retatrutide Log</title>
  <!-- Chart.js für flüssige iOS-Diagramme -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
  <style>
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --card-sub: #2c2c2e;
      --accent: #0a84ff;
      --accent-gradient: linear-gradient(180deg, rgba(10,132,255,0.25) 0%, rgba(10,132,255,0) 100%);
      --text: #ffffff;
      --sub: #8e8e93;
      --green: #30d158;
      --radius: 16px;
    }

    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

    body {
      margin: 0;
      padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 24px) 16px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .header-sub { font-size: 13px; color: var(--sub); text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; }
    h1 { font-size: 28px; font-weight: 700; margin: 2px 0 16px 0; letter-spacing: -0.5px; }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    /* Stat Cards */
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .stat-card { background: var(--card); border-radius: 12px; padding: 12px; border: 1px solid rgba(255,255,255,0.05); text-align: center; }
    .stat-val { font-size: 18px; font-weight: 700; margin-top: 2px; }
    .stat-lbl { font-size: 10px; color: var(--sub); font-weight: 600; text-transform: uppercase; }

    /* Graph Canvas */
    .chart-container { position: relative; height: 180px; width: 100%; margin-top: 8px; }

    /* Forms & Inputs */
    .input-group { margin-bottom: 10px; }
    label { font-size: 12px; color: var(--sub); display: block; margin-bottom: 4px; font-weight: 500; }
    input, select {
      width: 100%; height: 44px; padding: 0 12px; background: var(--card-sub);
      border: 1px solid rgba(255,255,255,0.05); border-radius: 10px; color: #fff;
      font-size: 16px; font-family: inherit; outline: none;
    }
    input:focus { border-color: var(--accent); }

    button {
      width: 100%; height: 46px; background: var(--accent); border: none;
      border-radius: 10px; color: #fff; font-size: 16px; font-weight: 600;
      margin-top: 6px; cursor: pointer; transition: transform 0.1s ease;
    }
    button:active { transform: scale(0.98); opacity: 0.9; }

    /* Segmented Control Switch */
    .segmented {
      display: flex; background: var(--card-sub); border-radius: 8px; padding: 2px; margin-bottom: 12px;
    }
    .segmented button {
      flex: 1; height: 28px; background: transparent; color: var(--sub); font-size: 12px;
      margin: 0; border-radius: 6px; font-weight: 500;
    }
    .segmented button.active { background: #636366; color: #fff; }

    /* Log List */
    .log-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .log-row:last-child { border-bottom: none; }
    .badge { background: rgba(10,132,255,0.15); color: var(--accent); padding: 3px 6px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  </style>
</head>
<body>

  <div class="header-sub">GLP-1 Protocol</div>
  <h1>Retatrutide Log</h1>

  <!-- Stats Grid -->
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-lbl">Start</div><div class="stat-val" id="startWt">123.4</div></div>
    <div class="stat-card"><div class="stat-lbl">Aktuell</div><div class="stat-val" style="color:var(--accent)" id="currWt">--</div></div>
    <div class="stat-card"><div class="stat-lbl">Verlust</div><div class="stat-val" style="color:var(--green)" id="diffWt">--</div></div>
  </div>

  <!-- Graph Card -->
  <div class="card">
    <div class="segmented">
      <button class="active" onclick="switchChart('weight')">Gewichtsverlauf</button>
      <button onclick="switchChart('serum')">Wirkstoff im Blut</button>
    </div>
    <div class="chart-container">
      <canvas id="weightChart"></canvas>
    </div>
  </div>

  <!-- Entry Mask -->
  <div class="card">
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
      <div class="input-group">
        <label>Datum</label>
        <input type="date" id="date">
      </div>
      <div class="input-group">
        <label>Gewicht (kg)</label>
        <input type="number" step="0.1" id="weight" placeholder="z. B. 117.5" inputmode="decimal">
      </div>
    </div>
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
      <div class="input-group">
        <label>Dosis (mg)</label>
        <input type="number" step="0.25" id="dose" placeholder="z. B. 2.0" inputmode="decimal">
      </div>
      <div class="input-group">
        <label>Stelle</label>
        <select id="site">
          <option value="">-- Keine --</option>
          <option value="Bauch L">Bauch L</option>
          <option value="Bauch R">Bauch R</option>
          <option value="Bein L">Bein L</option>
          <option value="Bein R">Bein R</option>
        </select>
      </div>
    </div>
    <button onclick="addEntry()">Eintrag Speichern</button>
  </div>

  <!-- History -->
  <div class="card">
    <div style="font-size:14px; font-weight:600; margin-bottom:8px; color:var(--sub);">VERLAUF</div>
    <div id="history"></div>
  </div>

  <script>
    const HALF_LIFE_DAYS = 6;
    document.getElementById('date').valueAsDate = new Date();

    const defaultLog = [{ date: "2026-08-02", weight: 123.4, dose: 0, site: "" }];
    let logs = JSON.parse(localStorage.getItem('reta_app_logs')) || defaultLog;
    let chartInstance = null;
    let currentMode = 'weight';

    function calculateSerum(targetDateStr) {
      const target = new Date(targetDateStr).getTime();
      let serum = 0;
      logs.forEach(l => {
        if (l.dose > 0) {
          const entryTime = new Date(l.date).getTime();
          const daysPassed = (target - entryTime) / (1000 * 60 * 60 * 24);
          if (daysPassed >= 0) {
            serum += l.dose * Math.pow(0.5, daysPassed / HALF_LIFE_DAYS);
          }
        }
      });
      return serum;
    }

    function addEntry() {
      const date = document.getElementById('date').value;
      const weight = parseFloat(document.getElementById('weight').value);
      const dose = parseFloat(document.getElementById('dose').value) || 0;
      const site = document.getElementById('site').value;

      if (!date) return alert('Bitte Datum wählen');

      logs.push({ date, weight: isNaN(weight) ? null : weight, dose, site });
      logs.sort((a,b) => new Date(a.date) - new Date(b.date));

      document.getElementById('weight').value = '';
      document.getElementById('dose').value = '';
      saveAndRender();
    }

    function saveAndRender() {
      localStorage.setItem('reta_app_logs', JSON.stringify(logs));
      updateDashboard();
      renderChart();
      renderHistory();
    }

    function updateDashboard() {
      const weights = logs.filter(l => l.weight !== null);
      if (weights.length > 0) {
        const start = weights[0].weight;
        const current = weights[weights.length - 1].weight;
        const diff = (current - start).toFixed(1);

        document.getElementById('startWt').innerText = start;
        document.getElementById('currWt').innerText = current;
        document.getElementById('diffWt').innerText = (diff > 0 ? '+' : '') + diff + ' kg';
      }
    }

    function switchChart(mode) {
      currentMode = mode;
      document.querySelectorAll('.segmented button').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      renderChart();
    }

    function renderChart() {
      const ctx = document.getElementById('weightChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      let labels = [];
      let data = [];
      let color = '#0a84ff';

      if (currentMode === 'weight') {
        const filtered = logs.filter(l => l.weight !== null);
        labels = filtered.map(l => l.date.slice(5));
        data = filtered.map(l => l.weight);
      } else {
        labels = logs.map(l => l.date.slice(5));
        data = logs.map(l => calculateSerum(l.date));
        color = '#30d158';
      }

      const gradient = ctx.createLinearGradient(0, 0, 0, 160);
      gradient.addColorStop(0, currentMode === 'weight' ? 'rgba(10,132,255,0.35)' : 'rgba(48,209,88,0.35)');
      gradient.addColorStop(1, 'rgba(0,0,0,0)');

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            data: data,
            borderColor: color,
            borderWidth: 3,
            backgroundColor: gradient,
            fill: true,
            tension: 0.35,
            pointBackgroundColor: color,
            pointRadius: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { display: false }, ticks: { color: '#8e8e93', font: { size: 10 } } },
            y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#8e8e93', font: { size: 10 } } }
          }
        }
      });
    }

    function renderHistory() {
      document.getElementById('history').innerHTML = [...logs].reverse().map(l => `
        <div class="log-row">
          <div>
            <div style="font-size:14px; font-weight:600;">${l.weight ? l.weight + ' kg' : 'Dosis-Log'}</div>
            <div style="font-size:11px; color:var(--sub);">${l.date} ${l.site ? '• ' + l.site : ''}</div>
          </div>
          <div>${l.dose ? `<span class="badge">💉 ${l.dose} mg</span>` : ''}</div>
        </div>
      `).join('');
    }

    updateDashboard();
    renderChart();
    renderHistory();
  </script>
</body>
</html>
