<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Retatrutide OS</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #000000;
      --card: rgba(28, 28, 30, 0.65);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent-blue: #0A84FF;
      --accent-green: #30D158;
      --accent-purple: #BF5AF2;
      --text: #FFFFFF;
      --sub: #8E8E93;
      --radius: 22px;
    }

    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

    body {
      margin: 0;
      padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 30px) 16px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    .app-header {
      display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px;
    }
    .app-title { font-size: 28px; font-weight: 800; letter-spacing: -0.6px; margin: 0; }
    .app-badge { font-size: 11px; font-weight: 700; color: var(--accent-purple); background: rgba(191, 90, 242, 0.15); padding: 4px 10px; border-radius: 20px; text-transform: uppercase; border: 1px solid rgba(191, 90, 242, 0.3); }

    /* Frosted Glass Cards */
    .glass-card {
      background: var(--card);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    /* Dashboard Metrics */
    .metrics-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
    .metric-box {
      background: rgba(44, 44, 46, 0.5);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 14px;
      position: relative;
      overflow: hidden;
    }
    .metric-box::before {
      content: ''; position: absolute; top:0; left:0; width:100%; height:2px;
      background: linear-gradient(90deg, transparent, var(--accent-blue), transparent);
    }
    .metric-val { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; margin-top: 4px; }
    .metric-lbl { font-size: 11px; font-weight: 600; color: var(--sub); text-transform: uppercase; }

    /* Chart Container */
    .chart-box { position: relative; height: 210px; width: 100%; }

    /* Dose Selector Chips */
    .dose-selector { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
    .dose-pill {
      background: rgba(44, 44, 46, 0.8);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 12px 0;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .dose-pill.active {
      background: linear-gradient(135deg, #0A84FF 0%, #5E5CE6 100%);
      border-color: #0A84FF;
      box-shadow: 0 4px 15px rgba(10, 132, 255, 0.4);
      transform: translateY(-2px);
    }

    /* Form Inputs */
    .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .input-field {
      width: 100%; height: 50px; background: rgba(44, 44, 46, 0.8);
      border: 1px solid rgba(255,255,255,0.08); border-radius: 14px;
      color: #fff; padding: 0 14px; font-size: 16px; font-family: inherit; outline: none;
    }
    .input-field:focus { border-color: var(--accent-blue); }

    .btn-action {
      width: 100%; height: 52px;
      background: linear-gradient(135deg, #30D158 0%, #10B981 100%);
      border: none; border-radius: 16px; color: #000;
      font-size: 16px; font-weight: 800; cursor: pointer;
      box-shadow: 0 4px 20px rgba(48, 209, 88, 0.35);
      transition: transform 0.1s ease;
    }
    .btn-action:active { transform: scale(0.97); }

    /* Feed List */
    .history-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .history-row:last-child { border-bottom: none; }
    .pill-dose { background: rgba(10,132,255,0.15); color: var(--accent-blue); padding: 4px 8px; border-radius: 8px; font-size: 12px; font-weight: 700; }
  </style>
</head>
<body>

  <div class="app-header">
    <div>
      <div style="font-size:12px; color:var(--sub); font-weight:600; text-transform:uppercase;">GLP-1 / GIP / Glucagon</div>
      <h1 class="app-title">Retatrutide</h1>
    </div>
    <span class="app-badge">Pro 2.0</span>
  </div>

  <!-- Dashboard Stats -->
  <div class="metrics-grid">
    <div class="metric-box">
      <div class="metric-lbl">Start (02.08.26)</div>
      <div class="metric-val" id="startWt">123.4 kg</div>
    </div>
    <div class="metric-box">
      <div class="metric-lbl">Aktuell</div>
      <div class="metric-val" style="color:var(--accent-blue)" id="currWt">-- kg</div>
    </div>
    <div class="metric-box">
      <div class="metric-lbl">Gesamtabnahme</div>
      <div class="metric-val" style="color:var(--accent-green)" id="diffWt">-- kg</div>
    </div>
    <div class="metric-box">
      <div class="metric-lbl">Wirkstoff im Blut</div>
      <div class="metric-val" style="color:var(--accent-purple)" id="serumVal">-- mg</div>
    </div>
  </div>

  <!-- Dual-Axis Combined Graph Card -->
  <div class="glass-card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <span style="font-size:13px; font-weight:700; color:var(--sub);">VERLAUF & HALBWERTSZEIT</span>
      <span style="font-size:11px; color:var(--accent-green);">● Blutspiegel  <span style="color:var(--accent-blue);">● Gewicht</span></span>
    </div>
    <div class="chart-box">
      <canvas id="mainChart"></canvas>
    </div>
  </div>

  <!-- Interactive Input Panel -->
  <div class="glass-card">
    <div style="font-size:13px; font-weight:700; color:var(--sub); margin-bottom:12px;">QUICK LOG</div>
    
    <div class="dose-selector">
      <div class="dose-pill" onclick="selectDose(0, this)">Keine</div>
      <div class="dose-pill" onclick="selectDose(1.0, this)">1.0 mg</div>
      <div class="dose-pill" onclick="selectDose(2.0, this)">2.0 mg</div>
      <div class="dose-pill" onclick="selectDose(2.5, this)">2.5 mg</div>
    </div>

    <div class="input-row">
      <input type="number" step="0.1" id="weightInput" class="input-field" placeholder="Gewicht (kg)" inputmode="decimal">
      <input type="date" id="dateInput" class="input-field">
    </div>

    <button class="btn-action" onclick="saveEntry()">Eintrag Speichern</button>
  </div>

  <!-- History Log -->
  <div class="glass-card">
    <div style="font-size:13px; font-weight:700; color:var(--sub); margin-bottom:8px;">LOGBUCH</div>
    <div id="historyLog"></div>
  </div>

  <script>
    document.getElementById('dateInput').valueAsDate = new Date();

    const HALF_LIFE = 6; // 6 Tage Halbwertszeit
    const defaultData = [{ date: "2026-08-02", weight: 123.4, dose: 0 }];
    let logs = JSON.parse(localStorage.getItem('reta_pro_v2')) || defaultData;
    let selectedDose = 0;
    let chartInstance = null;

    function selectDose(val, el) {
      document.querySelectorAll('.dose-pill').forEach(p => p.classList.remove('active'));
      el.classList.add('active');
      selectedDose = val;
    }

    // Biologisch korrekte Bateman-Funktion (Anflutung + 6-Tage-Halbwertszeit Abbau)
    function calculateSerum(targetDateStr) {
      let total = 0;
      const targetTime = new Date(targetDateStr).getTime();
      logs.forEach(l => {
        if (l.dose > 0) {
          const entryTime = new Date(l.date).getTime();
          const daysPassed = (targetTime - entryTime) / (1000 * 60 * 60 * 24);
          if (daysPassed >= 0) {
            total += l.dose * 1.35 * (Math.exp(-(Math.LN2 / HALF_LIFE) * daysPassed) - Math.exp(-1.2 * daysPassed));
          }
        }
      });
      return total;
    }

    function saveEntry() {
      const date = document.getElementById('dateInput').value;
      const weight = parseFloat(document.getElementById('weightInput').value);

      if (!date) return alert('Bitte Datum angeben');

      logs.push({ date, weight: isNaN(weight) ? null : weight, dose: selectedDose });
      logs.sort((a,b) => new Date(a.date) - new Date(b.date));

      document.getElementById('weightInput').value = '';
      selectedDose = 0;
      document.querySelectorAll('.dose-pill').forEach(p => p.classList.remove('active'));

      renderApp();
    }

    function renderApp() {
      localStorage.setItem('reta_pro_v2', JSON.stringify(logs));

      // Metrics Dashboard
      const weights = logs.filter(l => l.weight !== null);
      if (weights.length > 0) {
        const start = weights[0].weight;
        const current = weights[weights.length - 1].weight;
        const diff = (current - start).toFixed(1);

        document.getElementById('startWt').innerText = start + ' kg';
        document.getElementById('currWt').innerText = current + ' kg';
        document.getElementById('diffWt').innerText = (diff > 0 ? '+' : '') + diff + ' kg';
      }

      const activeSerum = calculateSerum(new Date().toISOString().split('T')[0]);
      document.getElementById('serumVal').innerText = activeSerum.toFixed(2) + ' mg';

      renderChart();
      renderLog();
    }

    function renderChart() {
      const ctx = document.getElementById('mainChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      let labels = [];
      let weightData = [];
      let serumData = [];

      if (logs.length > 0) {
        const startDate = new Date(logs[0].date);
        const endDate = new Date();
        endDate.setDate(endDate.getDate() + 6); // 6 Tage Zukunfts-Projektion

        for (let d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)) {
          const dateStr = d.toISOString().split('T')[0];
          labels.push(dateStr.slice(5));

          const log = logs.find(l => l.date === dateStr && l.weight !== null);
          weightData.push(log ? log.weight : null);
          serumData.push(calculateSerum(dateStr).toFixed(2));
        }
      }

      const serumGradient = ctx.createLinearGradient(0, 0, 0, 180);
      serumGradient.addColorStop(0, 'rgba(48, 209, 88, 0.35)');
      serumGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'Gewicht (kg)',
              data: weightData,
              borderColor: '#0A84FF',
              backgroundColor: '#0A84FF',
              borderWidth: 3,
              tension: 0.2,
              spanGaps: true,
              yAxisID: 'yWeight',
              pointRadius: 4,
              pointHoverRadius: 6
            },
            {
              label: 'Wirkstoff (mg)',
              data: serumData,
              borderColor: '#30D158',
              backgroundColor: serumGradient,
              borderWidth: 2,
              fill: true,
              tension: 0.4,
              yAxisID: 'ySerum',
              pointRadius: 0
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { display: false }, ticks: { color: '#8E8E93', font: { size: 10 } } },
            yWeight: {
              type: 'linear', position: 'left',
              grid: { color: 'rgba(255,255,255,0.05)' },
              ticks: { color: '#0A84FF', font: { size: 10 } }
            },
            ySerum: {
              type: 'linear', position: 'right',
              grid: { display: false },
              ticks: { color: '#30D158', font: { size: 10 } }
            }
          }
        }
      });
    }

    function renderLog() {
      document.getElementById('historyLog').innerHTML = [...logs].reverse().map(l => `
        <div class="history-row">
          <div>
            <div style="font-size:15px; font-weight:700;">${l.weight ? l.weight + ' kg' : 'Dosis'}</div>
            <div style="font-size:11px; color:var(--sub);">${l.date}</div>
          </div>
          <div>${l.dose ? `<span class="pill-dose">💉 ${l.dose} mg</span>` : ''}</div>
        </div>
      `).join('');
    }

    renderApp();
  </script>
</body>
</html>
