<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Retatrutide">
  <title>Retatrutide Tracker</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #161f32;
      --card-sub: #212d45;
      --accent: #38bdf8;
      --text: #f8fafc;
      --sub: #94a3b8;
      --radius: 18px;
    }

    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 20px) 16px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    h2 { font-size: 24px; font-weight: 700; margin: 8px 0 16px 0; }
    h3 { font-size: 16px; font-weight: 600; margin: 0 0 12px 0; color: #e2e8f0; }

    .card {
      background: var(--card);
      padding: 16px;
      border-radius: var(--radius);
      margin-bottom: 14px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .stat-box {
      background: var(--card-sub);
      padding: 12px;
      border-radius: 14px;
      text-align: center;
    }

    .stat-val { font-size: 18px; font-weight: 700; color: var(--accent); }
    .stat-lbl { font-size: 11px; color: var(--sub); margin-top: 2px; }

    input, button, select {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      margin-top: 8px;
      border-radius: 12px;
      border: none;
      font-size: 16px;
      font-family: inherit;
      appearance: none;
      -webkit-appearance: none;
    }

    input, select {
      background: var(--card-sub);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    button {
      background: var(--accent);
      color: #0f172a;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-sub {
      background: var(--card-sub);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .log-item {
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .log-header {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      font-size: 15px;
    }

    .log-details {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .tag {
      background: var(--card-sub);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
    }

    .tag-dose { background: #0284c7; color: #fff; }
    .tag-side { background: #881337; color: #fecdd3; }

    .rotation-alert {
      background: rgba(56, 189, 248, 0.1);
      border-left: 4px solid var(--accent);
      padding: 10px 14px;
      font-size: 13px;
      border-radius: 10px;
      margin-bottom: 14px;
    }

    /* Inline Simple Chart */
    .chart-container {
      width: 100%;
      height: 150px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding-top: 20px;
    }

    .chart-bar-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      justify-content: flex-end;
    }

    .chart-bar {
      width: 100%;
      background: var(--accent);
      border-radius: 4px 4px 0 0;
      min-height: 4px;
    }

    .chart-label {
      font-size: 9px;
      color: var(--sub);
      margin-top: 4px;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <h2>Retatrutide Tracker</h2>

  <!-- Dashboard Stats -->
  <div class="grid">
    <div class="stat-box"><div class="stat-val" id="startWt">--</div><div class="stat-lbl">Startgewicht</div></div>
    <div class="stat-box"><div class="stat-val" id="currWt">--</div><div class="stat-lbl">Aktuell</div></div>
    <div class="stat-box"><div class="stat-val" id="diffWt">--</div><div class="stat-lbl">Gesamtabnahme</div></div>
    <div class="stat-box"><div class="stat-val" id="activeLevel">--</div><div class="stat-lbl">Est. Wirkstoff (mg)</div></div>
  </div>

  <div id="rotationInfo" class="rotation-alert">Nächste Injektion: Stelle wählen...</div>

  <!-- Entry Form -->
  <div class="card">
    <h3>Neuer Eintrag</h3>
    <input type="datetime-local" id="datetime">
    <input type="number" step="0.1" id="weight" placeholder="Gewicht (kg)" inputmode="decimal">
    <input type="number" step="0.25" id="dose" placeholder="Retatrutide Dosis (mg)" inputmode="decimal">
    <select id="site">
      <option value="">-- Injektionsstelle wählen --</option>
      <option value="Bauch links">Bauch links</option>
      <option value="Bauch rechts">Bauch rechts</option>
      <option value="Oberschenkel links">Oberschenkel links</option>
      <option value="Oberschenkel rechts">Oberschenkel rechts</option>
      <option value="Oberarm links">Oberarm links</option>
      <option value="Oberarm rechts">Oberarm rechts</option>
    </select>
    <input type="text" id="sideEffects" placeholder="Nebenwirkungen (z. B. Übelkeit)">
    <button onclick="addEntry()">Eintrag Speichern</button>
  </div>

  <!-- Graph -->
  <div class="card">
    <h3>Gewichtsverlauf (Letzte Einträge)</h3>
    <div class="chart-container" id="chart"></div>
  </div>

  <!-- Backup -->
  <div class="card">
    <h3>Sicherung</h3>
    <div class="grid" style="margin-bottom:0;">
      <button class="btn-sub" onclick="exportCSV()">CSV Export</button>
      <button class="btn-sub" onclick="document.getElementById('importFile').click()">CSV Import</button>
    </div>
    <input type="file" id="importFile" style="display:none" onchange="importCSV(event)" accept=".csv">
  </div>

  <!-- Log History -->
  <div class="card">
    <h3>Historie</h3>
    <div id="history"></div>
  </div>

  <script>
    var HALF_LIFE_HOURS = 144;
    
    var now = new Date();
    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
    document.getElementById('datetime').value = now.toISOString().slice(0,16);

    var defaultInitialLog = [{
      datetime: "2026-08-02T08:00",
      weight: 123.4,
      dose: 0,
      site: "",
      sideEffects: "Startverlauf"
    }];

    var logs = [];
    try {
      var stored = localStorage.getItem('reta_pro_logs');
      logs = stored ? JSON.parse(stored) : defaultInitialLog;
    } catch(e) {
      logs = defaultInitialLog;
    }

    function calculateSerumLevel(targetDateStr) {
      var targetTime = new Date(targetDateStr).getTime();
      var totalLevel = 0;

      logs.forEach(function(l) {
        if (l.dose && l.dose > 0) {
          var entryTime = new Date(l.datetime).getTime();
          var hoursPassed = (targetTime - entryTime) / (1000 * 60 * 60);
          if (hoursPassed >= 0) {
            totalLevel += l.dose * Math.pow(0.5, hoursPassed / HALF_LIFE_HOURS);
          }
        }
      });
      return totalLevel;
    }

    function addEntry() {
      var datetime = document.getElementById('datetime').value;
      var weight = parseFloat(document.getElementById('weight').value);
      var dose = parseFloat(document.getElementById('dose').value) || 0;
      var site = document.getElementById('site').value;
      var sideEffects = document.getElementById('sideEffects').value.trim();

      if (!datetime) {
        alert('Bitte Datum angeben.');
        return;
      }

      logs.push({ 
        datetime: datetime, 
        weight: isNaN(weight) ? null : weight, 
        dose: dose, 
        site: site, 
        sideEffects: sideEffects 
      });

      logs.sort(function(a,b) { return new Date(a.datetime) - new Date(b.datetime); });
      
      document.getElementById('weight').value = '';
      document.getElementById('dose').value = '';
      document.getElementById('sideEffects').value = '';
      saveAndRender();
    }

    function updateDashboard() {
      var weights = logs.filter(function(l) { return l.weight !== null; });
      if (weights.length > 0) {
        var start = weights[0].weight;
        var current = weights[weights.length - 1].weight;
        var diff = (current - start).toFixed(1);

        document.getElementById('startWt').innerText = start + ' kg';
        document.getElementById('currWt').innerText = current + ' kg';
        document.getElementById('diffWt').innerText = (diff > 0 ? '+' : '') + diff + ' kg';
      }

      var activeSerum = calculateSerumLevel(new Date().toISOString());
      document.getElementById('activeLevel').innerText = activeSerum.toFixed(2);

      var doseLogs = logs.filter(function(l) { return l.site; });
      if (doseLogs.length > 0) {
        var lastSite = doseLogs[doseLogs.length - 1].site;
        document.getElementById('rotationInfo').innerText = 'Zuletzt gespritzt: ' + lastSite;
      }
    }

    function saveAndRender() {
      localStorage.setItem('reta_pro_logs', JSON.stringify(logs));
      updateDashboard();
      renderHistory();
      renderChart();
    }

    function renderHistory() {
      var html = '';
      var rev = logs.slice().reverse();
      for (var i = 0; i < rev.length; i++) {
        var l = rev[i];
        html += '<div class="log-item">' +
          '<div class="log-header">' +
            '<span>' + l.datetime.replace('T', ' ') + '</span>' +
            '<span>' + (l.weight ? l.weight + ' kg' : '') + '</span>' +
          '</div>' +
          '<div class="log-details">' +
            (l.dose ? '<span class="tag tag-dose">💉 ' + l.dose + ' mg</span>' : '') +
            (l.site ? '<span class="tag">📍 ' + l.site + '</span>' : '') +
            (l.sideEffects ? '<span class="tag tag-side">⚠️ ' + l.sideEffects + '</span>' : '') +
          '</div>' +
        '</div>';
      }
      document.getElementById('history').innerHTML = html;
    }

    function renderChart() {
      var filtered = logs.filter(function(l) { return l.weight !== null; }).slice(-7);
      if (filtered.length === 0) return;

      var maxW = Math.max.apply(Math, filtered.map(function(l) { return l.weight; }));
      var minW = Math.min.apply(Math, filtered.map(function(l) { return l.weight; })) - 2;

      var chartHtml = '';
      filtered.forEach(function(l) {
        var pct = ((l.weight - minW) / (maxW - minW || 1)) * 100;
        pct = Math.max(pct, 15);
        chartHtml += '<div class="chart-bar-wrap">' +
          '<div class="chart-bar" style="height:' + pct + '%;"></div>' +
          '<div class="chart-label">' + l.weight + '</div>' +
        '</div>';
      });
      document.getElementById('chart').innerHTML = chartHtml;
    }

    function exportCSV() {
      var csv = 'Datum;Gewicht;Dosis;Stelle;Nebenwirkungen\n';
      logs.forEach(function(l) {
        csv += l.datetime + ';' + (l.weight || '') + ';' + (l.dose || '') + ';' + (l.site || '') + ';' + (l.sideEffects || '') + '\n';
      });
      var blob = new Blob([csv], { type: 'text/csv' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'retatrutide_backup.csv';
      a.click();
    }

    function importCSV(e) {
      var file = e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(evt) {
        var lines = evt.target.result.split('\n').slice(1);
        logs = [];
        lines.forEach(function(line) {
          var parts = line.split(';');
          if (parts.length >= 2 && parts[0]) {
            logs.push({
              datetime: parts[0],
              weight: parts[1] ? parseFloat(parts[1]) : null,
              dose: parts[2] ? parseFloat(parts[2]) : 0,
              site: parts[3] || '',
              sideEffects: parts[4] || ''
            });
          }
        });
        saveAndRender();
        alert('Import erfolgreich!');
      };
      reader.readAsText(file);
    }

    updateDashboard();
    renderChart();
    renderHistory();
  </script>
</body>
</html>
