<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Retatrutide Tracker</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
  <style>
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --card-sub: #2c2c2e;
      --accent: #0a84ff;
      --green: #30d158;
      --text: #ffffff;
      --sub: #8e8e93;
      --radius: 20px;
    }

    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

    body {
      margin: 0;
      padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px) 16px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    /* Top Bar Header */
    .top-bar { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 16px; }
    .header-title { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
    .header-sub { font-size: 11px; color: var(--sub); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }

    /* Main Chart Card */
    .card-chart {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .chart-container { position: relative; height: 170px; width: 100%; }

    /* Segmented Switch */
    .seg-btn { background: var(--card-sub); border: none; color: var(--sub); padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 600; }
    .seg-btn.active { background: #3a3a3c; color: #fff; }

    /* Metric Cards Horizontal Scroll */
    .stats-scroll {
      display: flex; gap: 10px; overflow-x: auto; margin-bottom: 16px; padding-bottom: 4px;
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    .stats-scroll::-webkit-scrollbar { display: none; }
    .stat-pill {
      min-width: 105px; background: var(--card); border-radius: 14px; padding: 12px;
      border: 1px solid rgba(255,255,255,0.05); text-align: center; flex-shrink: 0;
    }
    .stat-val { font-size: 19px; font-weight: 700; margin-top: 2px; }
    .stat-lbl { font-size: 10px; color: var(--sub); font-weight: 600; text-transform: uppercase; }

    /* Interactive Action Panel */
    .action-panel {
      background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 16px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .panel-title { font-size: 14px; font-weight: 600; color: var(--sub); margin-bottom: 12px; }

    /* Quick Dose Chips */
    .chips-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
    .chip {
      background: var(--card-sub); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px;
      padding: 10px 0; text-align: center; font-size: 13px; font-weight: 600; color: #fff; cursor: pointer;
    }
    .chip.selected { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* Native Flex Input */
    .input-row { display: flex; gap: 10px; margin-bottom: 12px; }
    input {
      flex: 1; height: 46px; background: var(--card-sub); border: 1px solid rgba(255,255,255,0.05);
      border-radius: 12px; color: #fff; padding: 0 12px; font-size: 16px; font-family: inherit; outline: none;
    }
    input:focus { border-color: var(--accent); }

    .btn-main {
      width: 100%; height: 48px; background: var(--accent); border: none; border-radius: 12px;
      color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; transition: transform 0.1s;
    }
    .btn-main:active { transform: scale(0.98); opacity: 0.9; }

    /* Feed List */
    .feed-item {
      display: flex; justify-content: space-between; align-items: center; padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .feed-item:last-child { border-bottom: none; }
    .badge-dose { background: rgba(10,132,255,0.15); color: var(--accent); padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div>
      <div class="header-sub">Peptid Tracker</div>
      <div class="header-title">Retatrutide</div>
    </div>
  </div>

  <!-- Horizontal Metric Cards -->
  <div class="stats-scroll">
    <div class="stat-pill">
      <div class="stat-lbl">Start</div>
      <div class="stat-val" id="startWt">123.4</div>
    </div>
    <div class="stat-pill">
      <div class="stat-lbl">Aktuell</div>
      <div class="stat-val" style="color:var(--accent)" id="currWt">--</div>
    </div>
    <div class="stat-pill">
      <div class="stat-lbl">Abnahme</div>
      <div class="stat-val" style="color:var(--green)" id="diffWt">--</div>
    </div>
    <div class="stat-pill">
      <div class="stat-lbl">Blut-Spiegel</div>
      <div class="stat-val" id="serumVal">-- mg</div>
    </div>
  </div>

  <!-- Main Chart -->
  <div class="card-chart">
    <div class="chart-header">
      <span style="font-size:13px; font-weight:600; color:var(--sub);" id="chartTitle">GEWICHTSVERLAUF</span>
      <div>
        <button class="seg-btn active" id="btnWeight" onclick="switchMode('weight')">Gewicht</button>
        <button class="seg-btn" id="btnSerum" onclick="switchMode('serum')">Wirkstoff</button>
      </div>
    </div>
    <div class="chart-container">
      <canvas id="appChart"></canvas>
    </div>
  </div>

  <!-- Quick Log Panel -->
  <div class="action-panel">
    <div class="panel-title">SCHNELL-EINTRAG</div>
    
    <!-- Quick Dose Selector -->
    <div class="chips-grid">
      <div class="chip" onclick="selectDose(0, this)">Keine</div>
      <div class="chip" onclick="selectDose(1.0, this)">1.0 mg</div>
      <div class="chip" onclick="selectDose(2.0, this)">2.0 mg</div>
      <div class="chip" onclick="selectDose(2.5, this)">2.5 mg</div>
    </div>

    <div class="input-row">
      <input type="number" step="0.1" id="weight" placeholder="Gewicht (kg)" inputmode="decimal">
      <input type="date" id="date">
    </div>

    <button class="btn-main" onclick="submitLog()">Eintrag Speichern</button>
  </div>

  <!-- History -->
  <div class="card-chart" style="padding-top:12px;">
    <div style="font-size:12px; font-weight:600; color:var(--sub); margin-bottom:6px;">VERLAUF</div>
    <div id="historyFeed"></div>
  </div>

  <script>
    document.getElementById('date').valueAsDate = new Date();

    const HALF_LIFE = 6; // Halbwertszeit Retatrutide: 6 Tage
    const defaultData = [{ date: "2026-08-02", weight: 123.4, dose: 0 }];
    let logs = JSON.parse(localStorage.getItem('reta_ux_logs')) || defaultData;
    
    let selectedDoseVal = 0;
    let currentMode = 'weight';
    let chartInstance = null;

    function selectDose(val, el) {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
      selectedDoseVal = val;
    }

    function calculateSerum(targetDateStr) {
      let total = 0;
      const targetTime = new Date(targetDateStr).getTime();
      
      logs.forEach(l => {
        if (l.dose > 0) {
          const entryTime = new Date(l.date).getTime();
          const daysPassed = (targetTime - entryTime) / (1000 * 60 * 60 * 24);
          if (daysPassed >= 0) {
            // Bateman-Anflutung + Elimination
            total += l.dose * 1.35 * (Math.exp(-(Math.LN2 / HALF_LIFE) * daysPassed) - Math.exp(-1.2 * daysPassed));
          }
        }
      });
      return total;
    }

    function submitLog() {
      const date = document.getElementById('date').value;
      const weight = parseFloat(document.getElementById('weight').value);

      if (!date) return alert('Bitte Datum angeben');

      logs.push({ date, weight: isNaN(weight) ? null : weight, dose: selectedDoseVal });
      logs.sort((a,b) => new Date(a.date) - new Date(b.date));

      document.getElementById('weight').value = '';
      selectedDoseVal = 0;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
      
      renderAll();
    }

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('btnWeight').classList.toggle('active', mode === 'weight');
      document.getElementById('btnSerum').classList.toggle('active', mode === 'serum');
      document.getElementById('chartTitle').innerText = mode === 'weight' ? 'GEWICHTSVERLAUF' : 'WIRKSTOFF IM BLUT (MG)';
      renderChart();
    }

    function renderAll() {
      localStorage.setItem('reta_ux_logs', JSON.stringify(logs));
      
      // Dashboard Stats
      const weights = logs.filter(l => l.weight !== null);
      if (weights.length > 0) {
        const start = weights[0].weight;
        const current = weights[weights.length - 1].weight;
        const diff = (current - start).toFixed(1);

        document.getElementById('startWt').innerText = start;
        document.getElementById('currWt').innerText = current;
        document.getElementById('diffWt').innerText = (diff > 0 ? '+' : '') + diff + ' kg';
      }

      const activeSerum = calculateSerum(new Date().toISOString().split('T')[0]);
      document.getElementById('serumVal').innerText = activeSerum.toFixed(2) + ' mg';

      renderChart();
      renderFeed();
    }

    function renderChart() {
      const ctx = document.getElementById('appChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      let labels = [];
      let data = [];
      let color = '#0a84ff';

      if (currentMode === 'weight') {
        const filtered = logs.filter(l => l.weight !== null);
        labels = filtered.map(l => l.date.slice(5));
        data = filtered.map(l => l.weight);
      } else {
        if (logs.length > 0) {
          const startDate = new Date(logs[0].date);
          const endDate = new Date();
          endDate.setDate(endDate.getDate() + 5);

          for (let d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)) {
            const dateStr = d.toISOString().split('T')[0];
            labels.push(dateStr.slice(5));
            data.push(calculateSerum(dateStr).toFixed(2));
          }
        }
        color = '#30d158';
      }

      const gradient = ctx.createLinearGradient(0, 0, 0, 150);
      gradient.addColorStop(0, currentMode === 'weight' ? 'rgba(10,132,255,0.3)' : 'rgba(48,209,88,0.3)');
      gradient.addColorStop(1, 'rgba(0,0,0,0)');

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            data: data,
            borderColor: color,
            borderWidth: 2.5,
            backgroundColor: gradient,
            fill: true,
            tension: 0.35,
            pointRadius: currentMode === 'weight' ? 3 : 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { display: false }, ticks: { color: '#8e8e93', font: { size: 10 } } },
            y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#8e8e93', font: { size: 10 } } }
          }
        }
      });
    }

    function renderFeed() {
      document.getElementById('historyFeed').innerHTML = [...logs].reverse().map(l => `
        <div class="feed-item">
          <div>
            <div style="font-size:14px; font-weight:600;">${l.weight ? l.weight + ' kg' : 'Injektion'}</div>
            <div style="font-size:11px; color:var(--sub);">${l.date}</div>
          </div>
          <div>${l.dose ? `<span class="badge-dose">💉 ${l.dose} mg</span>` : ''}</div>
        </div>
      `).join('');
    }

    renderAll();
  </script>
</body>
</html>
